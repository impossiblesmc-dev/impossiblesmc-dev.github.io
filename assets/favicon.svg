  <rect x="8" y="10" width="48" height="2" fill="#A93B1E"/>
  <rect x="8" y="52" width="48" height="1" fill="#2A2520"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="700" fill="#2A2520">I</text>
</svg>
