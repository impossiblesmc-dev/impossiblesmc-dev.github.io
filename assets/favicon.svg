<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- The site icon is the front of the head, cropped out of the same skin
       texture the 3D figure is built from. The image is drawn at 8x so one
       skin pixel is 8 units, then shifted so uv(8,8) lands at the origin. -->
  <rect width="64" height="64" fill="#1a120c"/>
  <defs>
    <clipPath id="c"><rect width="64" height="64"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <image href="data:image/png;base64,"
           x="-64" y="-64" width="512" height="512"
           image-rendering="pixelated" style="image-rendering:pixelated"/>
  </g>
</svg>
